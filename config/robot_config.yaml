# SpotMicro link lengths and widths (mm)
# Measured with caliper on real robot
# body:
#   length: 185
#   width: 133

# leg_segments:
#   L1: 52.000    # Horizontal offset shoulder to leg
#   L2: 10.000    # Vertical offset shoulder to leg
#   L3: 115.000   # Upper leg length
#   L4: 140.000   # Lower leg length



# Extracted from F3D model
# body:
#   length: 184.5
#   width: 133

# leg_segments:
#   L1: 27.442          # Horizontal offset shoulder to leg
#   L2: 10.618          # Vertical offset shoulder to leg
#   L3: 109.243         # Upper leg length
#   L4: 131.957         # Lower leg length


# Link lengths and widths (mm) corrected for SpotMicroHMTY (SpotMicro with rubber ball feet)
body:
  length: 184.5
  width: 133
  com_offset_x: 0.0  # X offset (mm) geometric centre to COM
  com_offset_z: 0.0     # Z offset (mm) geometric centre to COM



leg_segments:
  L1: 27.442          # Horizontal offset shoulder to leg
  L2: 10.618          # Vertical offset shoulder to leg
  L3: 109.243         # Upper leg length
  L4: 140.000         # Lower leg length

# Per-joint angle limits in radians(Arbitrary values)
# TODO: Find safer values
joint_limits:
  shoulder: [-0.548,  0.548]   # theta1 
  elbow:    [-2.17,   0.97]    # theta2
  knee:     [-0.10,   2.59]    # theta3 


# Physical properties of some parts for CAD Design
base_plate:
  inner_length: 125
  inner_width: 95 

  outer_length: 94 
  outer_width: 106


holes:
  step_down:
    length: 55   # From center of hole to center of hole
    width: 30    # From center of hole to center of hole
    screw_diameter: 3
  rpi:
    length: 58 # From center of hole to center of hole
    width: 49  # From center of hole to center of hole
    screw_diameter: 2.5
  pca:
    length: 55.9 # From center of hole to center of hole
    width: 18.8  # From center of hole to center of hole
    screw_diameter: 2.5
  bulges:
    inner_radius: 3
    outer_radius: 6


# 16-point Bezier swing trajectory (normalized).
# _X: horizontal progression 0=liftoff, 1=touchdown
#     3 clustered at each end -> zero endpoint tangent velocity AND acceleration (smooth lift/land)
# _H: height factor relative to swing_height
gait:
  swing_x_norm: [0.0, 0.0, 0.0, -0.2, -0.25, -0.25, -0.25, 0.5, 0.5, 0.5, 1.2, 1.2, 1.1,  1.0, 1.0, 1.0]
  swing_h_norm: [0.0, 0.0, 0.0,  0.0,  0.6,   0.6,   0.6,  0.6, 0.6, 0.7, 0.7, 0.7, 0.0,  0.0, 0.0, 0.0]

  # Stance sine dip (mid-stance ground penetration): delta = base_frac * sh_mm + tilt_frac * |dy|
  stance_penetration_base_frac: 0.12   # fraction of swing_height for the base dip 
  stance_penetration_tilt_frac: 0.0    # fraction of per-leg roll/pitch leveling offset added to the dip

imu:
  length: 22
  width: 17

battery:
  length: 93
  width: 32
  height: 18

